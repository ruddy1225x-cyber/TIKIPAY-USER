<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi perfil | TikiPay</title>

  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="app-page">

  <header class="app-header">

    <a
      href="dashboard.html"
      class="brand"
    >
      <img
        src="assets/android-chrome-192x192.png"
        class="header-logo"
        alt="TikiPay"
      >

      <span>
        TikiPay
      </span>
    </a>

  </header>


  <main class="page-container">

    <section class="profile-header">

      <div
        id="profileAvatar"
        class="large-avatar"
      >
        T
      </div>

      <h1 id="profileName">
        Usuario
      </h1>

      <p id="profileTikiId">
        TIKI-XXXXXXXXXXXX
      </p>

    </section>


    <form
      id="profileForm"
      class="app-form"
    >

      <div class="form-group">

        <label for="profileFullName">
          Nombre completo
        </label>

        <input
          type="text"
          id="profileFullName"
          required
        >

      </div>


      <div class="form-group">

        <label for="profileEmail">
          Correo
        </label>

        <input
          type="email"
          id="profileEmail"
          disabled
        >

      </div>


      <div class="form-group">

        <label for="profilePhone">
          Teléfono
        </label>

        <input
          type="tel"
          id="profilePhone"
          placeholder="+591..."
        >

      </div>


      <div class="form-group">

        <label for="profileCountry">
          País
        </label>

        <select id="profileCountry">

          <option value="Bolivia">
            Bolivia
          </option>

          <option value="Argentina">
            Argentina
          </option>

          <option value="Brasil">
            Brasil
          </option>

          <option value="Chile">
            Chile
          </option>

          <option value="Peru">
            Perú
          </option>

          <option value="Otro">
            Otro
          </option>

        </select>

      </div>


      <button
        type="submit"
        class="primary-button"
      >
        Guardar cambios
      </button>

    </form>


    <div
      id="profileMessage"
      class="message"
    ></div>


    <section class="settings-menu">

      <a href="seguridad.html">
        <span>🔐 Seguridad</span>
        <span>›</span>
      </a>

      <a href="ajustes.html">
        <span>⚙ Ajustes</span>
        <span>›</span>
      </a>

      <a href="notificaciones.html">
        <span>🔔 Notificaciones</span>
        <span>›</span>
      </a>

    </section>


    <button
      type="button"
      id="logoutButton"
      class="logout-button"
    >
      Cerrar sesión
    </button>

  </main>


  <nav class="bottom-navigation">

    <a href="dashboard.html" class="nav-item">
      <span>⌂</span>
      Inicio
    </a>

    <a href="movimientos.html" class="nav-item">
      <span>⇄</span>
      Movimientos
    </a>

    <a href="servicios.html" class="nav-item">
      <span>◈</span>
      Servicios
    </a>

    <a href="perfil.html" class="nav-item active">
      <span>○</span>
      Perfil
    </a>

  </nav>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/perfil.js"></script>

</body>
</html>
